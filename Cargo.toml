[package]
name = "atlasdb"
version = "0.1.0"
edition = "2021"
description = "A fully-featured relational database engine built from scratch in Rust"
authors = ["AtlasDB Team"]

[dependencies]
thiserror = "2.0"
bytes = "1.9"
log = "0.4"
env_logger = "0.11"
crc32fast = "1.4"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
tempfile = "3.15"
rand = "0.8"

[[bin]]
name = "atlasdb"
path = "src/main.rs"

[lib]
name = "atlasdb"
path = "src/lib.rs"
